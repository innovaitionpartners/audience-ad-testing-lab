<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Proof before promise creative</title>
  <desc id="desc">A workflow diagram highlights one delayed handoff and a request-review call to action.</desc>
  <rect width="1200" height="628" fill="#eaf1f4"/>
  <rect x="58" y="54" width="1084" height="520" rx="18" fill="#ffffff" stroke="#b9cbd4" stroke-width="2"/>
  <text x="104" y="154" fill="#142535" font-family="Arial, sans-serif" font-size="54" font-weight="700">See the delay before it</text>
  <text x="104" y="216" fill="#142535" font-family="Arial, sans-serif" font-size="54" font-weight="700">costs another week.</text>
  <line x1="112" y1="350" x2="334" y2="350" stroke="#56748a" stroke-width="10"/>
  <line x1="416" y1="350" x2="638" y2="350" stroke="#9a3e42" stroke-width="10" stroke-dasharray="18 14"/>
  <line x1="720" y1="350" x2="942" y2="350" stroke="#166b65" stroke-width="10"/>
  <circle cx="112" cy="350" r="24" fill="#56748a"/>
  <circle cx="375" cy="350" r="38" fill="#fff" stroke="#9a3e42" stroke-width="10"/>
  <circle cx="679" cy="350" r="24" fill="#166b65"/>
  <circle cx="942" cy="350" r="24" fill="#166b65"/>
  <rect x="104" y="456" width="352" height="64" rx="8" fill="#166b65"/>
  <text x="136" y="497" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Request a workflow review</text>
  <text x="958" y="502" fill="#56748a" font-family="Arial, sans-serif" font-size="20">ACME / OPERATIONS</text>
</svg>
