<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental Persona Behavior Calibration Sandbox</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #f6f4ef;
      color: #20231f;
    }
    body {
      margin: 0;
      padding: 2rem;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d8d5cc;
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 16px 40px rgba(32, 35, 31, 0.08);
    }
    header {
      border-bottom: 3px solid #175f50;
      padding-bottom: 1.5rem;
    }
    section {
      border-top: 1px solid #e5e2da;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
    }
    h1, h2, h3 {
      line-height: 1.15;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0.4rem 0 1rem;
    }
    h2 {
      color: #175f50;
    }
    .eyebrow {
      color: #6a4a14;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .state {
      display: inline-block;
      background: #e5f2ed;
      border: 1px solid #87b7a8;
      border-radius: 999px;
      font-weight: 700;
      padding: 0.4rem 0.75rem;
    }
    dl {
      display: grid;
      grid-template-columns: minmax(10rem, 1fr) 3fr;
      gap: 0.6rem 1rem;
    }
    dt {
      font-weight: 700;
    }
    dd {
      margin: 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border-bottom: 1px solid #e5e2da;
      padding: 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f2f0ea;
    }
    code {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
{{REPORT_CONTENT}}
</body>
</html>
